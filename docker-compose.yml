services:
  mongodb:
    image: mongo:7
    container_name: pawfinds-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: pawfinds-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  backend:
    build:
      context: ./server
    container_name: pawfinds-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      mongooseURL: mongodb://mongodb:27017/pawfinds
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./server/images:/app/images

  frontend:
    build:
      context: ./Client
    container_name: pawfinds-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data: